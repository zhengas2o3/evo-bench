[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-bench"
version = "0.1.0"
description = "A lightweight, dependency-free benchmark harness for multi-objective evolutionary optimization algorithms"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ruizhao Zheng" }
]
keywords = ["evolutionary-algorithms", "multi-objective", "nsga-ii", "benchmark", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
evobench = "evobench.cli:main"

[project.urls]
Homepage = "https://github.com/zhengas2o3/evo-bench"

[tool.setuptools]
packages = ["evobench"]
